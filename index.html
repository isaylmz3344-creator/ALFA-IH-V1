<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>IH-CORE V1 | AI Assistant</title>
                <style>
                        :root { --neon: #00d4ff; --dark: #0a0a0a; --glass: rgba(255, 255, 255, 0.05); }
                                body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
                                        
                                                /* HER CİHAZA UYUMLU KASA */
                                                        .ai-shell { 
                                                                    width: 90%; max-width: 600px; padding: 30px; 
                                                                                background: var(--glass); border: 1px solid rgba(0, 212, 255, 0.3); 
                                                                                            border-radius: 25px; backdrop-filter: blur(15px);
                                                                                                        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5); text-align: center;
                                                                                                                }

                                                                                                                        .ai-header { font-size: 22px; font-weight: bold; letter-spacing: 3px; color: var(--neon); margin-bottom: 20px; }
                                                                                                                                
                                                                                                                                        /* YAPAY ZEKA EKRANI */
                                                                                                                                                #display { 
                                                                                                                                                            background: rgba(0,0,0,0.6); border-radius: 15px; padding: 20px; 
                                                                                                                                                                        min-height: 180px; margin-bottom: 20px; text-align: left;
                                                                                                                                                                                    font-size: 16px; border-left: 4px solid var(--neon); color: #ccc;
                                                                                                                                                                                            }

                                                                                                                                                                                                    input { 
                                                                                                                                                                                                                width: 100%; padding: 15px; background: #111; border: 1px solid #333; 
                                                                                                                                                                                                                            color: white; border-radius: 12px; margin-bottom: 15px; outline: none; box-sizing: border-box;
                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                            button { 
                                                                                                                                                                                                                                                        width: 100%; padding: 15px; background: var(--neon); color: black; 
                                                                                                                                                                                                                                                                    border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                    button:hover { background: white; box-shadow: 0 0 20px var(--neon); }

                                                                                                                                                                                                                                                                                            /* GELİŞTİRİCİ KISMI */
                                                                                                                                                                                                                                                                                                    .devs { margin-top: 25px; font-size: 12px; color: #666; border-top: 1px solid #222; padding-top: 15px; }
                                                                                                                                                                                                                                                                                                            .devs b { color: var(--neon); }
                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                </head>
                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                <div class="ai-shell">
                                                                                                                                                                                                                                                                                                                    <div class="ai-header">IH-CORE V1</div>
                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                            <div id="display">
                                                                                                                                                                                                                                                                                                                                    <b>[SİSTEM AKTİF]:</b> Merhaba aga! Ben her şeyi bilen, her dili konuşan yardımcı yapay zekayım. <br><br>
                                                                                                                                                                                                                                                                                                                                            Bana bir soru sor, bir link ver veya bir hesaplama yaptır. Ben hazırım!
                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="askAi" placeholder="Buraya yaz kanka...">
                                                                                                                                                                                                                                                                                                                                                        <button onclick="brainEngine()">SORUYU GÖNDER</button>

                                                                                                                                                                                                                                                                                                                                                            <div class="devs">
                                                                                                                                                                                                                                                                                                                                                                    Geliştiriciler: <b>İsa & Arkadaşı</b> <br>
                                                                                                                                                                                                                                                                                                                                                                            Powered by IH-Intelligence Core
                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                    async function brainEngine() {
                                                                                                                                                                                                                                                                                                                                                                                            const query = document.getElementById('askAi').value.trim().toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                    const screen = document.getElementById('display');
                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                    if(!query) return;

                                                                                                                                                                                                                                                                                                                                                                                                                            screen.innerHTML = "<b>[ANALİZ EDİLİYOR]:</b> Veriler taranıyor, mantık motoru çalışıyor... 🧠⚡";
                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                            // AI Düşünme Simülasyonu
                                                                                                                                                                                                                                                                                                                                                                                                                                                    await new Promise(r => setTimeout(r, 1500));

                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(query.includes("dueda")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        screen.innerHTML = "🚨 <b>GÜVENLİK UYARISI:</b> <br>Analizime göre www.dueda.com sitesi %100 tehlikeli! İçerisinde cihazına zarar verecek yazılımlar var. <b>Girme kanka!</b>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    screen.style.color = "#ff4d4d";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if(query.includes("hesapla") || query.includes("+") || query.includes("*")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        screen.innerHTML = "🔢 <b>HESAPLAMA MODU:</b> <br>Matematik benim işim. Her türlü denklemi ve siber risk olasılığını saniyeler içinde çözerim.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    screen.style.color = "#ccc";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if(query.includes("merhaba") || query.includes("selam")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        screen.innerHTML = "👋 <b>SELAM AGA!</b> <br>Seni ve arkadaşını siber dünyada korumak için buradayım. Bugün neyi hackliyoruz? (Şaka şaka, koruyoruz! 😊)";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    screen.style.color = "#ccc";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        screen.innerHTML = "🌐 <b>KÜRESEL BİLGİ:</b> <br>'" + query + "' konusunu tüm dillerde ve cihazlarda taradım. Her şey yolunda görünüyor kanka. Başka bir şey bilmek ister misin?";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    screen.style.color = "#ccc";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('askAi').value = ""; // Kutuyu temizle
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
